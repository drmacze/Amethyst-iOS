name: Amethyst Enhanced v4 A13

on:
  workflow_dispatch:
  push:
    branches:
      - enhanced/v4
  pull_request:
    branches:
      - enhanced/v3
      - main

permissions:
  contents: read

env:
  MOBILEGLUES_COMMIT: fbc4e412e353302607ba36489b2dd573b5becb25
  MESA_VERSION: 26.1.6
  MOLTENVK_VERSION: 1.4.2
  ANGLE_CHROMIUM_BRANCH: chromium/7871
  LWJGL_IOS_BRANCH: wip/rebase_3.4.1
  AMETHYST_CPU_TARGET: apple-a13

jobs:
  build-ios:
    name: Build Amethyst Enhanced v4 (A13 arm64)
    # x64 host is intentional. All shipped code below is cross-compiled arm64
    # for iPhone; macos-14 runners have substantially better availability than
    # scarce arm64 macos-15 hosts and use the same supported Xcode toolchain.
    runs-on: macos-14
    timeout-minutes: 300

    steps:
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 8 and 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            25

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install make ldid wget cmake ninja meson pkg-config python@3.12 ant autoconf automake libtool
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
          python3 -m pip install --user --break-system-packages mako pyyaml packaging
          /usr/libexec/java_home -V || true
          env | grep -E '^JAVA_HOME_(8|25)_' || true
          xcodebuild -version

      - name: Pin MobileGlues core and nested dependencies
        shell: bash
        run: |
          set -euxo pipefail
          MG=Natives/external/MobileGlues
          git -C "$MG" fetch --depth=1 origin "$MOBILEGLUES_COMMIT"
          git -C "$MG" checkout --detach "$MOBILEGLUES_COMMIT"
          git -C "$MG" submodule sync --recursive
          git -C "$MG" submodule update --init --recursive --depth=1
          test -f "$MG/MobileGlues-cpp/CMakeLists.txt"
          echo "Pinned MobileGlues: $(git -C "$MG" rev-parse HEAD)"

      - name: Build Chrome-stable ANGLE Metal backend
        shell: bash
        run: bash scripts/build_angle_v4.sh

      - name: Build stable MoltenVK and modern Mesa Zink
        shell: bash
        run: bash scripts/build_graphics_stack_v4.sh

      - name: Build isolated LWJGL 3.4.1 iOS runtime
        shell: bash
        run: bash scripts/build_lwjgl_v4.sh

      - name: Apply MobileGlues iOS performance and compatibility patches
        run: python3 scripts/patch_mobileglues_ios.py

      - name: Apply Enhanced runtime lifecycle fixes
        run: python3 scripts/patch_enhanced_runtime_v3.py

      - name: Prepare Enhanced performance build tree
        run: python3 scripts/prepare_enhanced_build.py

      - name: Add Enhanced safe cache manager
        run: python3 scripts/patch_cache_manager_v31.py

      - name: Apply Enhanced v4 graphics integration
        run: python3 scripts/patch_v4_graphics.py

      - name: Apply Enhanced v4 dual-LWJGL selector
        run: python3 scripts/patch_v4_lwjgl_runtime.py

      - name: Verify v4 build inputs
        shell: bash
        run: |
          set -euxo pipefail
          grep -n "MobileGlues-cpp" Makefile
          grep -n "CMAKE_BUILD_TYPE=Release" Makefile
          grep -n -- "-mcpu=apple-a13" Makefile Natives/CMakeLists.txt
          grep -nF "add_compile_options(-O3)" Natives/external/MobileGlues/MobileGlues-cpp/CMakeLists.txt
          grep -n "Zink Modern" Natives/LauncherPreferences.m
          grep -n "RENDERER_NAME_VK_ZINK_MODERN" Natives/utils.h
          grep -n "EnhancedGraphics" Natives/JavaLauncher.m
          grep -n "EnhancedRuntime" Natives/JavaLauncher.m
          grep -n "EnhancedMemory" Natives/JavaLauncher.m
          grep -n "performPendingRendererCacheCleanup" Natives/JavaLauncher.m
          grep -n "EnhancedUseModernLWJGL" Natives/JavaLauncher.m
          plutil -p Natives/Info.plist | grep 'Amethyst Enhanced v4'
          file Natives/resources/Frameworks/libMoltenVK.dylib
          file Natives/resources/Frameworks/libOSMesaModern.8.dylib
          file Natives/resources/Frameworks/libEGL.framework/libEGL
          file Natives/resources/Frameworks/libGLESv2.framework/libGLESv2
          file Natives/resources/Frameworks/lwjgl-modern/liblwjgl.dylib
          test -f Natives/resources/Frameworks/lwjgl-modern/liblwjgl_spvc.dylib
          test -s JavaApp/libs/others/lwjgl-legacy.jar
          test -s JavaApp/libs/others/lwjgl-modern-3.4.1.jar
          otool -L Natives/resources/Frameworks/libOSMesaModern.8.dylib

      - name: Build optimized IPA
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          BOOTJDK="${JAVA_HOME_8_ARM64:-${JAVA_HOME_8_X64:-}}/bin"
          test -x "$BOOTJDK/javac"
          gmake -j"$(sysctl -n hw.logicalcpu)" dsym package PLATFORM=2 RELEASE=1 BOOTJDK="$BOOTJDK"

      - name: Verify and name v4 artifact
        shell: bash
        run: |
          set -euxo pipefail
          IPA="$(find artifacts -maxdepth 1 -type f -name 'org.angelauramc.amethyst-*-ios.ipa' | head -n 1)"
          test -n "$IPA"
          test -s "$IPA"
          cp "$IPA" artifacts/Amethyst-Enhanced-v4-A13-iOS.ipa
          shasum -a 256 artifacts/Amethyst-Enhanced-v4-A13-iOS.ipa | tee artifacts/Amethyst-Enhanced-v4-A13-iOS.sha256
          unzip -l artifacts/Amethyst-Enhanced-v4-A13-iOS.ipa | tee /tmp/v4-ipa.txt >/dev/null
          grep -q 'Frameworks/libmobileglues.dylib' /tmp/v4-ipa.txt
          grep -q 'Frameworks/libOSMesaModern.8.dylib' /tmp/v4-ipa.txt
          grep -q 'Frameworks/libOSMesa.8.dylib' /tmp/v4-ipa.txt
          grep -q 'Frameworks/libMoltenVK.dylib' /tmp/v4-ipa.txt
          grep -q 'Frameworks/libEGL.framework/libEGL' /tmp/v4-ipa.txt
          grep -q 'Frameworks/libGLESv2.framework/libGLESv2' /tmp/v4-ipa.txt
          grep -q 'Frameworks/lwjgl-modern/liblwjgl_spvc.dylib' /tmp/v4-ipa.txt
          grep -q 'libs/lwjgl-modern-3.4.1.jar' /tmp/v4-ipa.txt
          grep -q 'libs/lwjgl-legacy.jar' /tmp/v4-ipa.txt
          grep -q 'graphics-stack-v4.json' /tmp/v4-ipa.txt
          ls -lh artifacts/Amethyst-Enhanced-v4-A13-iOS.ipa

      - name: Upload Amethyst Enhanced v4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Enhanced-v4-A13-iOS
          path: |
            artifacts/Amethyst-Enhanced-v4-A13-iOS.ipa
            artifacts/Amethyst-Enhanced-v4-A13-iOS.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Enhanced-v4-dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: ignore
          retention-days: 7
