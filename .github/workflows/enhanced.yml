name: Amethyst Enhanced v3.1 A13

on:
  workflow_dispatch:
  push:
    branches:
      - enhanced/v3
  pull_request:
    branches:
      - enhanced/v2
      - main

permissions:
  contents: read

env:
  MOBILEGLUES_COMMIT: fbc4e412e353302607ba36489b2dd573b5becb25
  AMETHYST_CPU_TARGET: apple-a13

jobs:
  build-ios:
    name: Build Amethyst Enhanced v3.1 (A13 arm64)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          brew install make ldid wget cmake
          brew install --cask temurin@8
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          /usr/libexec/java_home -V

      - name: Pin MobileGlues 2.0.0 and nested dependencies
        shell: bash
        run: |
          set -euxo pipefail
          MG=Natives/external/MobileGlues
          git -C "$MG" fetch --depth=1 origin "$MOBILEGLUES_COMMIT"
          git -C "$MG" checkout --detach "$MOBILEGLUES_COMMIT"
          git -C "$MG" submodule sync --recursive
          git -C "$MG" submodule update --init --recursive --depth=1
          test -f "$MG/MobileGlues-cpp/CMakeLists.txt"
          echo "Pinned MobileGlues: $(git -C "$MG" rev-parse HEAD)"

      - name: Apply MobileGlues iOS performance and compatibility patches
        run: python3 scripts/patch_mobileglues_ios.py

      - name: Apply Enhanced v3 runtime lifecycle fixes
        run: python3 scripts/patch_enhanced_runtime_v3.py

      - name: Prepare Enhanced v3 performance build tree
        run: python3 scripts/prepare_enhanced_build.py

      - name: Add Enhanced v3.1 cache manager
        run: |
          python3 scripts/patch_cache_manager_v31.py
          grep -n "EnhancedCacheManager.m" Natives/CMakeLists.txt
          grep -n "Clear Cache" Natives/LauncherMenuViewController.m
          grep -n "performPendingRendererCacheCleanup" Natives/JavaLauncher.m
          grep -n "Amethyst Enhanced v3.1" Natives/Info.plist

      - name: Verify performance build configuration
        run: |
          grep -n "MobileGlues-cpp" Makefile
          grep -n "CMAKE_BUILD_TYPE=Release" Makefile
          grep -n -- "-mcpu=apple-a13" Makefile Natives/CMakeLists.txt
          grep -nF "add_compile_options(-O3)" Natives/external/MobileGlues/MobileGlues-cpp/CMakeLists.txt
          grep -n "EnhancedMemory" Natives/JavaLauncher.m
          grep -n "MG_DIR_PATH" Natives/JavaLauncher.m
          grep -n "EnhancedRenderer" Natives/JavaLauncher.m
          grep -n "EnhancedPerf" Natives/JavaLauncher.m
          grep -n "EnhancedLifecycle" Natives/SurfaceViewController.m
          grep -n "enhancedPrepareForExit" Natives/ios_uikit_bridge.m

      - name: Build optimized IPA
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 RELEASE=1

      - name: Verify and name artifact
        shell: bash
        run: |
          set -euxo pipefail
          IPA="$(find artifacts -maxdepth 1 -type f -name 'org.angelauramc.amethyst-*-ios.ipa' | head -n 1)"
          test -n "$IPA"
          test -s "$IPA"
          cp "$IPA" artifacts/Amethyst-Enhanced-v3.1-A13-iOS.ipa
          shasum -a 256 artifacts/Amethyst-Enhanced-v3.1-A13-iOS.ipa | tee artifacts/Amethyst-Enhanced-v3.1-A13-iOS.sha256
          unzip -l artifacts/Amethyst-Enhanced-v3.1-A13-iOS.ipa | grep -q 'Frameworks/libmobileglues.dylib'
          ls -lh artifacts/Amethyst-Enhanced-v3.1-A13-iOS.ipa

      - name: Upload Amethyst Enhanced v3.1 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Enhanced-v3.1-A13-iOS
          path: |
            artifacts/Amethyst-Enhanced-v3.1-A13-iOS.ipa
            artifacts/Amethyst-Enhanced-v3.1-A13-iOS.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Enhanced-v3.1-dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: ignore
          retention-days: 7
